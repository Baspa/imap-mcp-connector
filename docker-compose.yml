services:
  app:
    build: .
    env_file: .env
    volumes:
      - app_data:/data
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
  caddy_data:
